{% extends 'base.html' %}
{% block content %}
<div class="page-content">
  <section class="section" data-reveal>
    <div class="container">
      <p class="section-label">journal</p>
      <h1 class="section-heading">Astrology Blog</h1>
      <div class="section-divider"></div>
      <div class="blog-grid">
        {% for post in posts %}
        <article class="post-card {% if loop.index == 1 %}post-card-large{% endif %}" data-reveal data-reveal-delay="100">
          <img src="{{ post.cover_image_url or bust('assets/placeholder.svg') }}" alt="{{ post.title }}" loading="lazy" width="640" height="360" />
          <div class="post-body">
            <h3>{{ post.title }}</h3>
            <p>{{ post.excerpt }}</p>
            <a class="btn-secondary" href="/blog/{{ post.slug }}">Read More</a>
          </div>
        </article>
        {% endfor %}
      </div>
    </div>
  </section>
</div>
{% endblock %}
